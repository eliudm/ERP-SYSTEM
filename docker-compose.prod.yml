version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: erp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-erpuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-erpdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do NOT expose port 5432 externally in production
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: always
    command: >
      sh -c "redis-server
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
      --save 60 1
      --loglevel warning"
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://${DB_USER:-erpuser}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-erpdb}
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  postgres_data:
    external: true
    name: erp-backend_postgres_data
  redis_data:
